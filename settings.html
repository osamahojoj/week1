<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeskHub - Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <div class="flex flex-col md:flex-row min-h-screen">
        
        <aside class="w-full md:w-64 bg-slate-900/60 border-b md:border-b-0 md:border-r border-slate-800 p-6 flex flex-col justify-between shrink-0">
            <div>
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-lg bg-emerald-600 flex items-center justify-center font-bold text-white text-sm">
                        AB
                    </div>
                    <div>
                        <strong class="block text-white leading-tight">Arab Bank</strong>
                        <span class="text-xs text-slate-400">Branch Portal</span>
                    </div>
                </div>

                <nav class="mt-8 flex flex-row md:flex-col gap-2 overflow-x-auto">
                    <a href="dashboard.html" class="flex items-center gap-2 px-3.5 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/50 font-medium text-sm whitespace-nowrap">
                        Dashboard
                    </a>
                    <a href="assets.html" class="flex items-center gap-2 px-3.5 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/50 font-medium text-sm whitespace-nowrap">
                        My Assets
                    </a>
                    <a href="settings.html" class="flex items-center gap-2 px-3.5 py-2 rounded-lg bg-blue-600/10 text-blue-400 border border-blue-500/20 font-medium text-sm whitespace-nowrap">
                        Settings
                    </a>
                </nav>
            </div>

            <div class="hidden md:block pt-6 border-t border-slate-800">
                <a href="login.html" class="text-sm font-medium text-red-400 hover:text-red-300">Sign Out</a>
            </div>
        </aside>

        <main class="flex-1 p-6 md:p-10 overflow-y-auto">
            <div class="mb-8">
                <h1 class="text-2xl font-bold text-white">Security Settings</h1>
                <p class="text-sm text-slate-400 mt-1">Change branch access password</p>
            </div>

            <div class="max-w-md bg-slate-900/60 border border-slate-800 rounded-xl p-6 shadow-xl">
                <form onsubmit="event.preventDefault(); alert('Password updated successfully');" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1.5">Current Password</label>
                        <input type="password" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1.5">New Password</label>
                        <input type="password" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
                    </div>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-5 py-2 rounded-lg text-sm transition shadow-lg shadow-blue-600/20 cursor-pointer">
                        Update Password
                    </button>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
